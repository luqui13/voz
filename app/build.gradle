plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vozordenes.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vozordenes.app'
        minSdk 26
        targetSdk 26
        versionCode 13
        versionName '13.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Firma fija: así cada versión nueva se instala encima de la anterior sin borrar las órdenes
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
